version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/codepipeline-app
    overwrite: true

permissions:
  - object: /home/ubuntu/codepipeline-app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 0755

hooks:
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: ubuntu
