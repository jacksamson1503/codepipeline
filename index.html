<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS ECS CI/CD Demo</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#0f172a; color:#e2e8f0; display:grid; place-items:center; min-height:100vh; }
    .card { width:min(700px,90%); padding:40px; background:#1e293b; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.35); }
    h1 { margin-top:0; }
    .flow { margin-top:24px; padding:18px; background:#0f172a; border-radius:12px; line-height:1.8; }
    .ok { color:#4ade80; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AWS ECS CI/CD Demo</h1>
    <p>This application was deployed through the Docker → ECR → ECS pipeline.</p>
    <div class="flow">
      GitHub → Jenkins → Docker Build → Amazon ECR → Amazon ECS → EC2
    </div>
    <p class="ok">● Application is running successfully</p>
  </div>
</body>
</html>
